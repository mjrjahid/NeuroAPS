<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Y.3172 workflow mapping</title>
  <desc id="desc">A compact flow from MRI source to human review, with orchestration and sandbox support.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFC"/><stop offset="1" stop-color="#EAF5F4"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#167C86"/></marker>
  </defs>
  <rect width="1000" height="360" rx="26" fill="url(#g)"/>
  <text x="48" y="54" font-family="Segoe UI,Arial" font-size="18" font-weight="750" fill="#167C86" letter-spacing="2">ITU-T Y.3172 WORKFLOW</text>
  <g font-family="Segoe UI,Arial" text-anchor="middle">
    <g transform="translate(86 104)"><rect width="138" height="88" rx="16" fill="#FFFFFF" stroke="#CADAE2"/><text x="69" y="37" font-size="18" font-weight="750" fill="#10243A">SRC + C</text><text x="69" y="62" font-size="13" fill="#617581">MRI intake</text></g>
    <g transform="translate(276 104)"><rect width="138" height="88" rx="16" fill="#FFFFFF" stroke="#CADAE2"/><text x="69" y="37" font-size="18" font-weight="750" fill="#10243A">PP</text><text x="69" y="62" font-size="13" fill="#617581">Brain → points</text></g>
    <g transform="translate(466 104)"><rect width="138" height="88" rx="16" fill="#FFFFFF" stroke="#CADAE2"/><text x="69" y="37" font-size="18" font-weight="750" fill="#10243A">M + P</text><text x="69" y="62" font-size="13" fill="#617581">Evidence + rules</text></g>
    <g transform="translate(656 104)"><rect width="138" height="88" rx="16" fill="#FFFFFF" stroke="#CADAE2"/><text x="69" y="37" font-size="18" font-weight="750" fill="#10243A">D</text><text x="69" y="62" font-size="13" fill="#617581">Distribute</text></g>
    <g transform="translate(846 104)"><rect width="108" height="88" rx="16" fill="#167C86"/><text x="54" y="37" font-size="18" font-weight="750" fill="#FFFFFF">SINK</text><text x="54" y="62" font-size="13" fill="#D6F0ED">Human review</text></g>
  </g>
  <g stroke="#167C86" stroke-width="3" marker-end="url(#a)"><path d="M224 148h44"/><path d="M414 148h44"/><path d="M604 148h44"/><path d="M794 148h44"/></g>
  <g font-family="Segoe UI,Arial">
