    <text x="500" y="273" text-anchor="middle" font-size="16" font-weight="750" fill="#FFFFFF">MLFO · Sandbox · Underlay</text>
    <text x="500" y="297" text-anchor="middle" font-size="13" fill="#C9D9E2">orchestration · evaluation · local/institutional runtime</text>
