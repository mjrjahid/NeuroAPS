<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Dense voxel processing compared with anatomical point-cloud processing</title>
  <desc id="desc">A professional scientific illustration showing a dense voxel volume transformed into a lightweight anatomically selected point cloud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#E8F4F3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#10243A" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="960" height="560" rx="30" fill="url(#bg)"/>
  <text x="58" y="64" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#687C88" letter-spacing="2">REPRESENTATION EFFICIENCY</text>
  <g transform="translate(70 112)" opacity=".86">
    <text x="0" y="0" font-family="Segoe UI,Arial" font-size="27" font-weight="750" fill="#10243A">Dense voxel volume</text>
    <g transform="translate(22 50)" stroke="#8294A2" stroke-width="1.5" fill="none">
      <path d="M0 70 130 0l150 70-130 70Z" fill="#DCE4EA"/>
      <path d="M0 70v160l150 75V140"/>
      <path d="M150 140 280 70v160l-130 75"/>
      <g opacity=".65">
        <path d="M32 53 181 125M65 35l149 72M98 18l149 72M43 91l150 75M86 114l150 75M0 120l150 75M0 170l150 75M50 43v162M100 16v214M200 27v218M245 49v183"/>
      </g>
    </g>
    <text x="20" y="398" font-family="Segoe UI,Arial" font-size="18" fill="#5A6F7D">Full grid · high compute demand</text>
  </g>
  <g transform="translate(392 252)">
    <circle r="48" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M-19 0h34M3-19l19 19L3 19" fill="none" stroke="#167C86" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(500 112)">
    <text x="0" y="0" font-family="Segoe UI,Arial" font-size="27" font-weight="750" fill="#10243A">Anatomical point cloud</text>
    <g transform="translate(128 155)">
      <ellipse rx="142" ry="112" fill="#FFFFFF" filter="url(#shadow)"/>
      <g fill="#E04F6F">
        <circle cx="-63" cy="38" r="7"/><circle cx="-45" cy="48" r="5"/><circle cx="-76" cy="22" r="5"/><circle cx="62" cy="38" r="7"/><circle cx="45" cy="50" r="5"/><circle cx="78" cy="21" r="5"/>
      </g>
      <g fill="#16A6B6">
        <circle cx="-17" cy="-11" r="8"/><circle cx="17" cy="-11" r="8"/><circle cx="-9" cy="9" r="5"/><circle cx="10" cy="9" r="5"/>
      </g>
      <g fill="#7C5CE5">
        <circle cx="-100" cy="-24" r="5"/><circle cx="-76" cy="-62" r="6"/><circle cx="-32" cy="-84" r="5"/><circle cx="21" cy="-86" r="6"/><circle cx="72" cy="-63" r="5"/><circle cx="103" cy="-25" r="6"/><circle cx="112" cy="24" r="5"/><circle cx="-111" cy="23" r="5"/>
      </g>
      <g fill="#E7A83E" opacity=".9">
        <circle cx="-69" cy="-15" r="4"/><circle cx="-42" cy="10" r="4"/><circle cx="-11" cy="49" r="4"/><circle cx="20" cy="43" r="4"/><circle cx="53" cy="7" r="4"/><circle cx="75" cy="-14" r="4"/><circle cx="5" cy="-49" r="4"/>
      </g>
    </g>
    <g transform="translate(0 350)" font-family="Segoe UI,Arial">
      <rect width="355" height="86" rx="16" fill="#10243A"/>
      <text x="22" y="31" font-size="17" fill="#BCE1DE">NeuroAPS-Net · 8,192 points</text>
      <text x="22" y="63" font-size="19" font-weight="750" fill="#FFFFFF">84.85% · 1.48 ms · 234.6 MB</text>
    </g>
  </g>
